<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Book Entry</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #5865F2;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4752C4;
        }

        #result {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>📚 Library Entry</h1>

    <form id="libraryForm">

        <label for="bookName">
            Book Name
        </label>

        <input
            type="text"
            id="bookName"
            placeholder="Enter book name"
            required
        >

        <label for="enrollmentNo">
            Enrollment Number
        </label>

        <input
            type="text"
            id="enrollmentNo"
            placeholder="Enter enrollment number"
            required
        >

        <button type="submit">
            Record Book
        </button>

    </form>

    <div id="result"></div>

</div>


<script>

    // PUT YOUR DISCORD WEBHOOK HERE
    const DISCORD_WEBHOOK =
        "https://discord.com/api/webhooks/1540332609819902074/LdO1x7KW-zSwhby1k30UfS77n-c9kRtVKQAqr1YXbpXr46g2n5BJfblzXLcWigQQFspk";


    document
        .getElementById("libraryForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const bookName =
                document.getElementById("bookName").value.trim();

            const enrollmentNo =
                document.getElementById("enrollmentNo").value.trim();

            const result =
                document.getElementById("result");


            if (!bookName || !enrollmentNo) {

                result.textContent =
                    "Please fill all fields.";

                return;
            }


            const message = {

                content:
`📚 **LIBRARY BOOK RECORD**

📖 **Book Name:** ${bookName}

🎓 **Enrollment No:** ${enrollmentNo}

🕒 **Time:** ${new Date().toLocaleString()}`

            };


            try {

                const response = await fetch(
                    DISCORD_WEBHOOK,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(message)
                    }
                );


                if (response.ok) {

                    result.textContent =
                        "✅ Book recorded successfully!";

                    document
                        .getElementById("libraryForm")
                        .reset();

                } else {

                    result.textContent =
                        "❌ Failed to send data.";

                }

            } catch (error) {

                console.error(error);

                result.textContent =
                    "❌ Error connecting to Discord.";
            }

        });

</script>

</body>
</html>
